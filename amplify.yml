version: 1

frontend:
  phases:
    preBuild:
      commands:
        - npm ci

    build:
      commands:
        - env | grep -e DATABASE_URL >> .env.production
        - env | grep -e BETTER_AUTH_URL >> .env.production
        - env | grep -e BETTER_AUTH_SECRET >> .env.production
        - env | grep -e R2_ACCOUNT_ID >> .env.production
        - env | grep -e R2_ACCESS_KEY_ID >> .env.production
        - env | grep -e R2_SECRET_ACCESS_KEY >> .env.production
        - env | grep -e R2_BUCKET >> .env.production
        - env | grep -e R2_PUBLIC_URL >> .env.production
        - env | grep -e RESEND_API_KEY >> .env.production
        - env | grep -e RESEND_FROM_EMAIL >> .env.production
        - env | grep -e LEAD_NOTIFY_EMAIL >> .env.production
        - env | grep -e INDEXNOW_KEY >> .env.production
        - env | grep -e INVITE_EMAIL_DOMAIN >> .env.production
        - env | grep -e TURNSTILE_SECRET_KEY >> .env.production
        - env | grep -e TURNSTILE_SECRET >> .env.production
        - env | grep -e CRON_SECRET >> .env.production
        - env | grep -e PREVIEW_SECRET >> .env.production
        - env | grep -e NEXT_PUBLIC_ >> .env.production
        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*